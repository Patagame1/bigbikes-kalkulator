name: Refresh manufacturer model catalog

on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-model-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check official manufacturer model lists
        run: node scripts/refresh-model-catalog.mjs --write

      - name: Validate catalog
        run: node scripts/validate-catalog.mjs

      - name: Publish catalog update to repository
        run: |
          if git diff --quiet -- catalog/catalog.json catalog/releases; then
            echo "Catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/catalog.json catalog/releases
          git commit -m "Update manufacturer model catalog"
          git push
